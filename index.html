<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Junja — gerador de palavras sem sentido</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="layout">

    <!-- Coluna esquerda: gerador -->
    <main class="card" aria-live="polite">
      <header class="header">
        <p class="title"><span class="spark" aria-hidden="true">✦</span> GERADOR JUNJA <span class="spark" aria-hidden="true">✦</span></p>
        <p class="subtitle">clique e descubra sua próxima palavra favorita</p>
      </header>

      <section class="word-display" id="wordDisplay">
        <span class="word" id="wordText">&nbsp;</span>
        <button class="icon-btn" id="audioBtn" aria-label="Ouvir a palavra" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
            <path d="M18.36 5.64a9 9 0 0 1 0 12.73" />
          </svg>
        </button>
      </section>

      <button class="primary-btn" id="junjaBtn">Junja</button>

      <section class="rules">
        <p class="rules-title">💡 Palavras geradas seguem regras específicas:</p>
        <ul class="rules-list">
          <li>Começam COMM J ou G</li>
          <li>Terminam com "n" ou "son"</li>
          <li>Segunda letra sempre vogal</li>
          <li>Sem letras repetidas consecutivas</li>
        </ul>
      </section>

      <section class="history" id="historySection" hidden>
        <p class="history-label">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 3" />
          </svg>
          histórico desta visita
        </p>
        <div class="history-chips" id="historyChips"></div>
      </section>
    </main>

    <!-- Coluna direita: significado -->
    <aside class="card meaning-card" id="meaningCard" aria-live="polite">
      <p class="meaning-word" id="meaningWord">📖 Aguardando palavra...</p>
      <div class="divider"></div>
      <p class="meaning-row" id="meaningPronuncia"></p>
      <p class="meaning-row meaning-tipo" id="meaningTipo"></p>
      <div class="divider"></div>
      <p class="meaning-definicao" id="meaningDefinicao"></p>
      <div class="divider"></div>
      <p class="meaning-exemplo-label" id="meaningExemploLabel"></p>
      <p class="meaning-exemplo" id="meaningExemplo"></p>
    </aside>

  </div>

  <script src="generator.js"></script>
  <script src="meaning.js"></script>
  <script src="app.js"></script>
</body>
</html>
